name: KPI regression tests
on:
  push:
    branches: [test-v2.17]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m compileall -q app.py core.py demo.py axis_self.py workflow.py common_criteria.py personal_exports.py leader_ui.py excel_preview.py team_review_parts.py quick.py
      - run: python tests/test_app.py
      - run: python tests/test_demo.py
        if: always()
